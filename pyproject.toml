[build-system]
requires = ["setuptools>=73,<74", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubiks-scanner-guide"
version = "0.1.0"
description = "Webcam-guided Rubik's Cube scanner, solver, and visual move guide."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Bishwaswarup Nayak"}]
dependencies = [
  "numpy==2.1.3",
  "opencv-python==4.10.0.84",
  "scipy==1.14.1",
  "kociemba==1.2.1",
]

[project.scripts]
rubiks-guide = "main:main"

[tool.setuptools]
py-modules = ["arrows", "colors", "config", "cube", "guide", "main", "patterns", "scan", "solve"]
